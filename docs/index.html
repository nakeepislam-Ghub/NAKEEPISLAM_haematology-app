<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3891">
<meta name="description" content="Interactive haematology learning for Clinical Pathology postgraduates.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Interactive Diagnostic Haematology</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app frame with a left rail on wide screens and a bottom tab bar on phones.
   Palette taken from a Romanowsky-stained film: methylene azure, eosin, glass. */
:root {
  --bg: #faf7f9;
  --surface: #ffffff;
  --sunk: #f2edf3;
  --ink: #221b2c;
  --muted: #675d74;
  --line: #e4dce8;
  --azure: #4a3891;
  --azure-soft: #ebe6f7;
  --eosin: #b93a60;
  --eosin-soft: #fae6ec;
  --ok: #23714f;
  --ok-soft: #e1f2e9;
  --bad: #a83232;
  --bad-soft: #fbe5e5;
  --slide: #f7f0f2;
  --shadow: 0 1px 2px rgba(34,27,44,.06), 0 6px 20px rgba(34,27,44,.06);
  --f-display: "Spectral", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14111a; --surface: #1d1925; --sunk: #241f2e; --ink: #ece7f3; --muted: #a79eb5; --line: #342d40;
  --azure: #b0a2ef; --azure-soft: #2c2645; --eosin: #f08aa7; --eosin-soft: #3d2030;
  --ok: #6fd1a2; --ok-soft: #173326; --bad: #f19494; --bad-soft: #3d1d1d; --slide: #ece3e7;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14111a; --surface: #1d1925; --sunk: #241f2e; --ink: #ece7f3; --muted: #a79eb5; --line: #342d40;
  --azure: #b0a2ef; --azure-soft: #2c2645; --eosin: #f08aa7; --eosin-soft: #3d2030;
  --ok: #6fd1a2; --ok-soft: #173326; --bad: #f19494; --bad-soft: #3d1d1d; --slide: #ece3e7;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.18rem; margin-top: 1.6em; margin-bottom: .4em; }
p { margin: .6em 0; }
a { color: var(--azure); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; border-radius: 4px; }
.label { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Frame */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-size: 1.02rem; line-height: 1.15; display: block; }
.brand small { color: var(--muted); font-size: .78rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: .95rem; }
.nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav a:hover { background: var(--sunk); }
.nav a[aria-current="page"] { background: var(--azure-soft); color: var(--azure); }
.rail-foot { margin-top: auto; font-size: .8rem; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.netpill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; }
.netpill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.netpill.off::before { background: var(--eosin); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; }
.top .crumb { font-weight: 600; color: var(--muted); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.modsel { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 600; font-size: .88rem; max-width: 46vw; min-width: 0; }
.module.current { border-color: var(--azure); box-shadow: 0 0 0 1px var(--azure); }
.search { margin-left: auto; position: relative; flex: 0 1 320px; min-width: 0; }
.search input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(420px, calc(100vw - 32px)); max-height: 60vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; }
.results a { display: block; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); }
.results a:hover, .results a:focus { background: var(--sunk); }
.results small { display: block; color: var(--muted); font-size: .8rem; }
.page { padding-block: 24px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; width: 100%; }
.tabs-mobile { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .tabs-mobile { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabs-mobile a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; font-size: .7rem; font-weight: 600; color: var(--muted); text-decoration: none; }
  .tabs-mobile a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabs-mobile a[aria-current="page"] { color: var(--azure); }
  .top .crumb { display: none; }
  .search { flex: 1 1 auto; margin-left: 0; }
  .page { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}

/* Shared pieces */
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--azure); }
.btn svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--azure); border-color: var(--azure); color: var(--surface); }
.btn.small { padding: 5px 11px; font-size: .88rem; }
.btn[disabled] { opacity: .45; cursor: default; }
.chip { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .88rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.muted { color: var(--muted); }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--eosin-soft); color: var(--eosin); }
.tag.az { background: var(--azure-soft); color: var(--azure); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--azure); border-radius: 3px; }
.tablewrap { overflow-x: auto; margin: .8em 0; }
table.t { border-collapse: collapse; width: 100%; font-size: .93rem; min-width: 460px; }
table.t th { text-align: left; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--line); padding: 6px 10px; }
table.t td { border-bottom: 1px solid var(--line); padding: 7px 10px; vertical-align: top; }
table.t.num td:not(:first-child) { font-family: var(--f-mono); font-size: .86rem; white-space: nowrap; }
.cellsvg { display: block; width: 100%; height: auto; border-radius: 8px; }
.figure { background: var(--slide); border-radius: 10px; overflow: hidden; }
.pic { position: relative; }
.pic img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; background: var(--slide); }
.pic-tag { position: absolute; left: 6px; top: 6px; font-size: .68rem; line-height: 1; padding: 3px 6px; border-radius: 99px; background: rgba(255,255,255,.85); color: #4a3f55; }
.pic-credit { display: block; font-size: .68rem; line-height: 1.3; color: var(--muted); margin-top: 4px; }
.pic-credit a, .pic-fig figcaption a { color: inherit; }
.pic-fig { margin: 14px 0; }
.pic-fig .figure { margin: 0 0 6px; }
.pic-fig.small .figure { max-width: 240px; }
.pic-fig figcaption { font-size: .78rem; line-height: 1.4; color: var(--muted); max-width: 380px; }
.credits { font-size: .86rem; padding-left: 1.3em; }
.credits li { margin-bottom: 6px; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 30px; }
.hero p.lede { font-size: 1.12rem; color: var(--muted); max-width: 54ch; }
.hero-cells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hero-cells .figure:nth-child(2) { transform: translateY(18px); }
.modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.module { position: relative; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); }
.module .n { font-family: var(--f-display); font-size: 2rem; color: var(--azure); line-height: 1; }
.module.locked { background: var(--sunk); }
.module.locked .n { color: var(--muted); }
.module h3 { margin: 0; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.quick a { display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); }
.quick a b { font-size: 1rem; }
.quick a span { color: var(--muted); font-size: .86rem; }
.quick a:hover { border-color: var(--azure); }
.section-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 30px 0 12px; flex-wrap: wrap; }

/* Learn */
.learn { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 4px; }
.toc button { text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: start; }
.toc button:hover { background: var(--sunk); }
.toc button[aria-current="true"] { background: var(--azure-soft); color: var(--azure); font-weight: 600; }
.toc .tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); margin-top: 3px; display: grid; place-items: center; font-size: .7rem; }
.toc .tick.done { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.reader { max-width: 72ch; min-width: 0; }
.reader .meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: .9rem; margin: 8px 0 18px; }
.reader ul, .reader ol { padding-left: 1.3em; }
.reader li { margin: .3em 0; }
.keypoints { background: var(--azure-soft); border-radius: var(--r); padding: 16px 18px; margin: 26px 0 14px; }
.keypoints h3 { margin: 0 0 6px; font-size: 1.05rem; color: var(--azure); }
.keypoints ul { margin: 0; }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin: 18px 0; }
.strip button { border: 0; padding: 0; background: none; text-align: left; font-size: .8rem; color: var(--muted); }
.strip button span { display: block; margin-top: 4px; line-height: 1.25; }
.sources { font-size: .88rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 20px; }
.sources ul { padding-left: 1.1em; margin: 4px 0; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

@media (max-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .learn { grid-template-columns: minmax(0, 1fr); }
  .toc { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 6px; }
  .toc button { flex: none; max-width: 210px; }
}

/* Atlas */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
.atlas { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.atlas button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.atlas button:hover { border-color: var(--azure); }
.atlas b { font-size: .92rem; line-height: 1.25; padding: 0 2px; }
.atlas small { color: var(--muted); font-size: .78rem; padding: 0 2px; }
.drawer-bg { position: fixed; inset: 0; background: rgba(20,14,28,.45); z-index: 40; display: flex; justify-content: flex-end; }
.drawer { width: min(560px, 100%); height: 100%; overflow-y: auto; background: var(--surface); padding: 22px; padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); box-shadow: var(--shadow); }
.drawer .figure { max-width: 380px; margin: 14px 0; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 14px; margin: 12px 0; font-size: .95rem; }
.kv dt { color: var(--muted); font-weight: 600; font-size: .85rem; }
.kv dd { margin: 0; }
.note { font-size: .82rem; color: var(--muted); }

/* Practice */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: var(--surface); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--azure); color: var(--surface); }
.flash { perspective: 1200px; max-width: 560px; margin: 18px 0; }
.flash-inner { position: relative; min-height: 340px; transition: transform .5s; transform-style: preserve-3d; cursor: pointer; }
.flash-inner.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; justify-content: center; gap: 10px; box-shadow: var(--shadow); }
.face.back { transform: rotateY(180deg); background: var(--azure-soft); }
.face .q { font-family: var(--f-display); font-size: 1.35rem; line-height: 1.3; }
.face .figure { width: 210px; max-width: 100%; align-self: center; }
@media (prefers-reduced-motion: reduce) { .flash-inner { transition: none; } }
.quiz { max-width: 680px; }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.opt { text-align: left; padding: 12px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.opt:hover:not([disabled]) { border-color: var(--azure); }
.opt .letter { font-family: var(--f-mono); font-weight: 600; color: var(--muted); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.explain { border-left: 3px solid var(--azure); padding: 6px 14px; background: var(--sunk); border-radius: 0 8px 8px 0; }

/* Cases */
.cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.cases button { text-align: left; display: flex; flex-direction: column; gap: 8px; }
.cases button:hover { border-color: var(--azure); }
.casedata { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 14px 0; }
.casedata div { background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
.casedata small { display: block; color: var(--muted); font-size: .76rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.casedata b { font-family: var(--f-mono); font-size: .92rem; }
.step { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }

/* Workups */
.tree { display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
.trail { display: flex; flex-wrap: wrap; gap: 6px; font-size: .85rem; }
.trail span { background: var(--sunk); padding: 3px 9px; border-radius: 999px; color: var(--muted); }
.endbox { border: 2px solid var(--eosin); border-radius: var(--r); padding: 16px; background: var(--eosin-soft); }
.endbox h3 { margin: 0 0 6px; color: var(--eosin); }
.checklist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; max-width: 700px; }
.checklist label { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); cursor: pointer; }
.checklist input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--ok); }
.checklist input:checked + div { color: var(--muted); }
.checklist input:checked + div b { text-decoration: line-through; }
.calcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: .84rem; font-weight: 600; color: var(--muted); }
.field input, .field select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); font-family: var(--f-mono); width: 100%; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.out { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--azure-soft); }
.out b { font-family: var(--f-mono); }

/* Animations */
.anim { display: flex; flex-direction: column; gap: 12px; }
.svgwrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.svgwrap svg { display: block; min-width: 640px; width: 100%; height: auto; }
.svgwrap text { fill: var(--ink); font-family: var(--f-body); }
.tnode circle { transition: opacity .4s, transform .4s; }
.tnode { cursor: pointer; }
.tnode.hidden, .tedge.hidden { opacity: 0; }
.tnode, .tedge { transition: opacity .45s; }
.tedge { stroke: var(--muted); stroke-width: 1.6; fill: none; }
.mat { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 22px; align-items: start; }
.mat .stage { position: relative; aspect-ratio: 1; max-width: 100%; }
.mat .stage > div { position: absolute; inset: 0; transition: opacity .6s; }
.slider { width: 100%; accent-color: var(--azure); }
.ticks { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); gap: 4px; }
.ticks span { flex: 1; text-align: center; min-width: 0; }

  body: `
<p>Haematopoiesis is the production of all blood cells from a small pool of self-renewing haematopoietic stem cells (HSCs). In an adult, the marrow makes roughly 2.5 × 10<sup>9</sup> red cells, 2.5 × 10<sup>9</sup> platelets and 1 × 10<sup>9</sup> granulocytes per kilogram per day, and it can raise this output several-fold under stress.</p>
<h3>Sites by age</h3>
<table class="t"><thead><tr><th>Stage</th><th>Main site</th><th>Notes</th></tr></thead><tbody>
<tr><td>Weeks 3 to 8</td><td>Yolk sac (mesoblastic phase)</td><td>Primitive, nucleated megaloblastic red cells making embryonic haemoglobins (Gower 1, Gower 2, Portland)</td></tr>
<tr><td>Week 6 to month 7</td><td>Liver, with a smaller contribution from the spleen (hepatic phase)</td><td>Definitive haematopoiesis seeded from the aorta–gonad–mesonephros (AGM) region; HbF predominates</td></tr>
<tr><td>Month 5 onwards</td><td>Bone marrow (medullary phase)</td><td>The only normal site after birth</td></tr>
<tr><td>Childhood</td><td>Almost all bones</td><td>Red marrow gradually replaced by fat in the long bones</td></tr>
<tr><td>Adult</td><td>Axial skeleton: vertebrae, ribs, sternum, skull, pelvis, proximal femur and humerus</td><td>Posterior iliac crest is the standard sampling site</td></tr>
</tbody></table>
<p>Extramedullary haematopoiesis in an adult (liver, spleen, paravertebral masses) is always abnormal. It is seen in severe chronic haemolysis, thalassaemia major and primary myelofibrosis.</p>
<h3>The stem cell hierarchy</h3>
<p>The classical model places the HSC at the top. It gives rise to multipotent progenitors (MPP), which split into a common myeloid progenitor (CMP) and a common lymphoid progenitor (CLP). The CMP produces the megakaryocyte–erythroid progenitor (MEP) and the granulocyte–monocyte progenitor (GMP). Single-cell studies now show this is closer to a continuum: some HSCs are already biased towards megakaryocytes, and lineage choice happens earlier than the tree suggests. The tree is still the most useful frame for interpreting immunophenotypes.</p>
<ul>
<li><b>HSC phenotype:</b> CD34+, CD38−, CD90+, CD45RA−, lineage-negative. CD34+ cells make up about 1% to 2% of normal marrow nucleated cells.</li>
<li><b>Colony assays:</b> CFU-GEMM (mixed), BFU-E and CFU-E (erythroid), CFU-GM, CFU-Meg.</li>
<li><b>Niche:</b> HSCs live close to sinusoidal endothelium and perivascular stromal cells that secrete CXCL12 (SDF-1) and stem cell factor. The CXCL12–CXCR4 axis holds them in the marrow; plerixafor blocks CXCR4 to mobilise stem cells for collection.</li>
</ul>
<h3>Growth factors</h3>
<table class="t"><thead><tr><th>Factor</th><th>Source</th><th>Main action</th></tr></thead><tbody>
<tr><td>Erythropoietin (EPO)</td><td>Peritubular interstitial cells of the kidney (about 90%), liver</td><td>Survival and proliferation of CFU-E and early erythroblasts; production rises with tissue hypoxia through HIF-2α</td></tr>
<tr><td>Thrombopoietin (TPO)</td><td>Liver, made at a constant rate</td><td>Binds MPL on platelets and megakaryocytes; free TPO level falls as platelet mass rises</td></tr>
<tr><td>G-CSF</td><td>Macrophages, endothelium, fibroblasts</td><td>Neutrophil production and release</td></tr>
<tr><td>GM-CSF, IL-3</td><td>T cells, macrophages</td><td>Early multilineage progenitors</td></tr>
<tr><td>M-CSF</td><td>Stromal cells</td><td>Monocyte and macrophage lineage</td></tr>
<tr><td>IL-5</td><td>T helper 2 cells</td><td>Eosinophils</td></tr>
<tr><td>SCF (KIT ligand), FLT3 ligand</td><td>Stromal cells</td><td>Early progenitors, mast cells (SCF)</td></tr>
<tr><td>IL-7</td><td>Stromal cells</td><td>Early B and T lymphopoiesis</td></tr>
</tbody></table>
<h3>Transcription factors to know</h3>
<p>GATA2 and RUNX1 maintain early progenitors. GATA1 with its cofactor FOG1, and KLF1, drive erythroid and megakaryocytic differentiation. PU.1 (SPI1) and C/EBPα drive myeloid differentiation; high PU.1 favours monocytes and lower PU.1 with C/EBPα favours granulocytes. PAX5 commits B cells, and Notch signalling with GATA3 commits T cells. Many of these genes are mutated in myeloid neoplasms (RUNX1, CEBPA, GATA2), which is why they matter later in Module 3.</p>
`,

  body: `
<p>Committed erythroid progenitors (BFU-E, then CFU-E) give rise to the first morphologically recognisable cell, the proerythroblast. Through about four divisions over 5 to 7 days, each proerythroblast yields around 16 red cells. Erythroblasts mature in erythroblastic islands around a central macrophage, which supplies iron and engulfs the extruded nuclei.</p>
<h3>Maturation sequence</h3>
<table class="t"><thead><tr><th>Stage</th><th>Size</th><th>Nucleus</th><th>Cytoplasm</th></tr></thead><tbody>
<tr><td>Proerythroblast</td><td>15–20 µm</td><td>Large, round, fine chromatin, 1–2 nucleoli</td><td>Deeply basophilic, often with a paler perinuclear zone; may show blebs</td></tr>
<tr><td>Basophilic (early) erythroblast</td><td>12–16 µm</td><td>Coarser chromatin, nucleoli not seen</td><td>Intensely blue, from abundant ribosomes</td></tr>
<tr><td>Polychromatic (intermediate) erythroblast</td><td>10–12 µm</td><td>Chequerboard chromatin clumping; last stage that divides</td><td>Grey-lilac as haemoglobin accumulates</td></tr>
<tr><td>Orthochromatic (late) erythroblast</td><td>8–10 µm</td><td>Small, dense, pyknotic, then extruded</td><td>Nearly the colour of a mature red cell</td></tr>
<tr><td>Reticulocyte</td><td>8–9 µm</td><td>None</td><td>Polychromatic on Romanowsky stain; residual RNA forms a reticulum with new methylene blue</td></tr>
<tr><td>Red cell</td><td>7.2–7.9 µm diameter</td><td>None</td><td>Biconcave disc with central pallor about one third of the diameter</td></tr>
</tbody></table>
<p>Reticulocytes spend about 1 to 2 days maturing in the marrow and about 1 day in the blood. Under strong EPO drive they are released early ("shift" or stress reticulocytes) and stay longer in the circulation, which is why the reticulocyte production index corrects for this.</p>
<h3>Haemoglobin</h3>
<p>Each haemoglobin molecule is a tetramer of two α-like and two β-like globin chains, each carrying one haem group (protoporphyrin IX with ferrous iron). The α-globin cluster is on chromosome 16 (two α genes per chromosome, so four in total) and the β-globin cluster is on chromosome 11.</p>
<table class="t"><thead><tr><th>Haemoglobin</th><th>Chains</th><th>Normal adult level</th></tr></thead><tbody>
<tr><td>HbA</td><td>α<sub>2</sub>β<sub>2</sub></td><td>About 97%</td></tr>
<tr><td>HbA<sub>2</sub></td><td>α<sub>2</sub>δ<sub>2</sub></td><td>2.2% to 3.5%</td></tr>
<tr><td>HbF</td><td>α<sub>2</sub>γ<sub>2</sub></td><td>Under 1%; 60% to 90% at birth, falling to adult levels by about 1 year</td></tr>
<tr><td>Gower 1, Gower 2, Portland</td><td>ζ<sub>2</sub>ε<sub>2</sub>, α<sub>2</sub>ε<sub>2</sub>, ζ<sub>2</sub>γ<sub>2</sub></td><td>Embryonic only</td></tr>
</tbody></table>
<h3>Oxygen delivery</h3>
<p>The oxygen dissociation curve is sigmoid because binding is cooperative. The P<sub>50</sub> (oxygen tension at 50% saturation) is about 26.6 mmHg (3.5 kPa) in adult blood. The curve shifts right, releasing more oxygen to tissues, with acidosis (the Bohr effect), raised CO<sub>2</sub>, fever and raised 2,3-bisphosphoglycerate (2,3-BPG). HbF binds 2,3-BPG poorly, so fetal blood has a left-shifted curve (P<sub>50</sub> about 19 mmHg), which favours oxygen transfer across the placenta. Try the interactive curve in the Animations section.</p>
<h3>Red cell metabolism</h3>
<ul>
<li><b>Glycolysis (Embden–Meyerhof pathway):</b> about 90% of glucose. Produces ATP for the cation pumps and membrane, and NADH for cytochrome b5 reductase, which keeps haem iron in the ferrous state. Pyruvate kinase deficiency is the commonest defect here.</li>
<li><b>Hexose monophosphate shunt:</b> about 10% of glucose. G6PD produces NADPH, which regenerates reduced glutathione to protect against oxidant damage.</li>
<li><b>Rapoport–Luebering shunt:</b> makes 2,3-BPG, which lowers oxygen affinity.</li>
</ul>
<h3>Membrane and lifespan</h3>
<p>The membrane skeleton is a spectrin lattice tied to the lipid bilayer vertically (via ankyrin, band 3 and protein 4.2) and horizontally (via protein 4.1, actin and adducin). Vertical defects cause hereditary spherocytosis; horizontal defects cause elliptocytosis. Red cells survive about 120 days and are removed mainly by splenic and hepatic macrophages. Haem is converted to biliverdin and then unconjugated bilirubin, and the iron is recycled through ferroportin under the control of hepcidin.</p>
`,

  body: `
<p>Granulopoiesis moves from a mitotic pool (myeloblast, promyelocyte, myelocyte) to a maturation and storage pool (metamyelocyte, band, segmented neutrophil). The myelocyte is the last stage that divides. Transit from myeloblast to release takes about 10 to 14 days, and the marrow holds a reserve of neutrophils several times larger than the circulating pool.</p>
<h3>Neutrophil maturation</h3>
<table class="t"><thead><tr><th>Stage</th><th>Size</th><th>Key features</th></tr></thead><tbody>
<tr><td>Myeloblast</td><td>12–20 µm</td><td>High nuclear to cytoplasmic ratio, fine open chromatin, 2–5 nucleoli. Agranular or a few azurophilic granules (WHO counts both as blasts)</td></tr>
<tr><td>Promyelocyte</td><td>15–25 µm (the largest stage)</td><td>Many primary (azurophilic) granules, which contain MPO. Nucleus often eccentric with a visible nucleolus and a pale perinuclear Golgi zone (hof)</td></tr>
<tr><td>Myelocyte</td><td>10–18 µm</td><td>Secondary (specific) granules appear, giving a pinkish-lilac cytoplasm. Round or oval nucleus, condensed chromatin, no nucleoli</td></tr>
<tr><td>Metamyelocyte</td><td>10–15 µm</td><td>Nucleus indented, kidney-shaped, indentation less than half its width. No longer divides</td></tr>
<tr><td>Band (stab) form</td><td>10–14 µm</td><td>Nucleus U- or C-shaped with roughly parallel sides and no true filament</td></tr>
<tr><td>Segmented neutrophil</td><td>12–15 µm</td><td>2 to 5 lobes joined by thin chromatin filaments. More than 5 lobes, or over 5% of cells with 5 lobes, is hypersegmentation</td></tr>
</tbody></table>
<p>A female "drumstick" (the inactive X chromosome) is seen on a small proportion of neutrophils in women.</p>
<h3>Neutrophil granules</h3>
<ul>
<li><b>Primary (azurophilic):</b> myeloperoxidase, neutrophil elastase, cathepsin G, defensins, proteinase 3, lysozyme.</li>
<li><b>Secondary (specific):</b> lactoferrin, lysozyme, collagenase, haptocorrin (vitamin B<sub>12</sub> binding protein), cytochrome b<sub>558</sub>.</li>
<li><b>Tertiary:</b> gelatinase (MMP-9).</li>
<li><b>Secretory vesicles:</b> membrane receptors such as CD11b/CD18 that move to the surface on activation.</li>
</ul>
<h3>Neutrophil kinetics and function</h3>
<p>Released neutrophils split roughly equally between a circulating pool and a marginated pool along vessel walls; adrenaline and exercise shift marginated cells into the count within minutes. Blood half-life is about 6 to 7 hours, after which they enter tissues and die there within a day or two.</p>
<ol>
<li><b>Rolling:</b> selectins (L-selectin on the neutrophil, E- and P-selectin on endothelium).</li>
<li><b>Firm adhesion:</b> β2 integrins (CD11/CD18) bind ICAM-1. Absent in leucocyte adhesion deficiency type 1.</li>
<li><b>Chemotaxis:</b> towards C5a, IL-8 (CXCL8), leukotriene B<sub>4</sub> and bacterial formyl peptides.</li>
<li><b>Phagocytosis:</b> enhanced by opsonins, IgG (via Fc receptors) and C3b.</li>
<li><b>Killing:</b> NADPH oxidase generates superoxide and hydrogen peroxide (the respiratory burst), and MPO turns hydrogen peroxide into hypochlorous acid. NADPH oxidase is defective in chronic granulomatous disease. Neutrophils can also release extracellular traps (NETs).</li>
</ol>
<h3>Eosinophils</h3>
<p>12–17 µm, usually a bilobed nucleus, cytoplasm packed with large orange-red granules containing major basic protein, eosinophil cationic protein, eosinophil peroxidase and eosinophil-derived neurotoxin. Charcot–Leyden crystals are made of galectin-10. Production depends on IL-5. Counts are highest at night and fall after corticosteroids. They defend against helminths and drive allergic inflammation.</p>
<h3>Basophils</h3>
<p>10–14 µm, the least common blood leucocyte. Large dark purple-black granules often hide the nucleus. Granules contain histamine and heparin and are water-soluble, so they can wash out during staining and leave the cell looking empty. Basophils carry the high-affinity IgE receptor (FcεRI) and express CD123 and CD203c on flow cytometry, but not CD117, which separates them from mast cells. A raised basophil count is an important clue to chronic myeloid leukaemia.</p>
`,

<h3>Monocytes and macrophages</h3>
<p>Monocytes are the largest normal leucocytes in blood at 15–20 µm. The nucleus is folded, lobulated or kidney-shaped with a lacy, delicate chromatin pattern. The cytoplasm is grey-blue with a ground-glass look, fine azurophilic granules and often vacuoles. They circulate for 1 to 3 days before entering tissues.</p>
<p>Immunophenotype: CD14, CD64, CD11b, CD33 (bright), CD36, HLA-DR. In tissue, monocyte-derived and resident macrophages include Kupffer cells (liver), alveolar macrophages, splenic red pulp macrophages, microglia and osteoclasts (formed by fusion). In the marrow, macrophages hold storage iron, which is graded on a Perls stain.</p>
<h3>Lymphocytes</h3>
<ul>
<li><b>Small lymphocyte:</b> 7–10 µm, round nucleus with dense clumped chromatin, thin rim of pale blue cytoplasm.</li>
<li><b>Large lymphocyte:</b> 12–16 µm, more abundant cytoplasm.</li>
<li><b>Large granular lymphocyte (LGL):</b> abundant pale cytoplasm with a few coarse azurophilic granules. These are NK cells or cytotoxic CD8+ T cells and make up 10% to 15% of blood lymphocytes.</li>
</ul>
<table class="t"><thead><tr><th>Subset</th><th>Share of blood lymphocytes</th><th>Markers</th></tr></thead><tbody>
<tr><td>T cells</td><td>About 60% to 80%</td><td>CD2, CD3, CD5, CD7; CD4 helper and CD8 cytotoxic (CD4:CD8 about 2:1)</td></tr>
<tr><td>B cells</td><td>About 10% to 20%</td><td>CD19, CD20, CD22, CD79a, surface immunoglobulin with κ or λ light chain</td></tr>
<tr><td>NK cells</td><td>About 10% to 15%</td><td>CD16, CD56, CD3 negative</td></tr>
</tbody></table>
<p>Young children have a higher lymphocyte count than adults, so a lymphocyte count that would be raised in an adult can be normal at age 2. Reactive lymphocytes (in viral infections) are larger, with abundant cytoplasm that is darker blue at the edge and scalloped around neighbouring red cells.</p>
<h3>Plasma cells</h3>
<p>The end stage of B cell differentiation. Oval cell with an eccentric nucleus, coarse "clock-face" chromatin, deeply basophilic cytoplasm and a pale perinuclear Golgi zone (hof). Normal marrow plasma cells are up to about 3% to 3.5% of nucleated cells, are polytypic and express CD38 (bright), CD138, CD19 and CD45, without CD56. Loss of CD19 and gain of CD56 point to a neoplastic population, which Module 3 covers.</p>
<h3>Hematogones</h3>
<p>Normal B cell precursors in the marrow. They look like small to medium blasts with scant cytoplasm and smooth chromatin, and are prominent in children, in regenerating marrow after chemotherapy and after transplant. On flow cytometry they show an orderly maturation pattern (CD34 and CD10 in early cells, then CD20 rising), unlike the arrested, uniform pattern of B lymphoblastic leukaemia.</p>
`,

  body: `
<p>Megakaryocytes develop from the MEP (or directly from megakaryocyte-biased stem cells) under the control of thrombopoietin through its receptor MPL. Instead of dividing, the cell replicates its DNA repeatedly without cytokinesis (endomitosis), reaching 8N to 64N, most often 16N. The result is the largest cell in the marrow, 50–100 µm or more, with a single lobulated nucleus.</p>
<h3>Stages</h3>
<ul>
<li><b>Megakaryoblast:</b> hard to recognise on morphology; may show cytoplasmic blebs. Identified by CD41, CD42b and CD61.</li>

<h3>Structure</h3>
<p>Haematopoietic tissue fills the spaces between bony trabeculae, supported by a stromal network of reticulin fibres, adipocytes, fibroblastic reticular cells, macrophages and a rich sinusoidal circulation. In a trephine section, the different lineages have typical locations:</p>
<ul>
<li><b>Granulocyte precursors</b> mature from the paratrabecular and perivascular regions towards the centre of the intertrabecular space.</li>
<li><b>Erythroid islands</b> sit centrally, often near sinusoids, around a macrophage.</li>
<li><b>Megakaryocytes</b> lie next to sinusoids, away from the bone surface. Paratrabecular megakaryocytes or tight clusters are abnormal.</li>
<li><b>Lymphoid aggregates</b> can be found in normal marrow, more often in older people. They are small, well-circumscribed and not paratrabecular.</li>
</ul>
<h3>Cellularity</h3>
<p>Cellularity is the proportion of the marrow space occupied by haematopoietic cells rather than fat. A rough guide is 100 minus the age in years: close to 100% at birth, about 50% to 70% in young adults and 30% to 40% or less in the elderly. Subcortical marrow is often hypocellular even in healthy people, so cellularity should be judged on intertrabecular spaces deeper in the core.</p>
<h3>Aspirate or trephine?</h3>
<table class="t"><thead><tr><th></th><th>Aspirate</th><th>Trephine biopsy</th></tr></thead><tbody>
<tr><td>Best for</td><td>Cell morphology, differential count, iron stores and ring sideroblasts, flow cytometry, cytogenetics, molecular tests</td><td>Cellularity, architecture, fibrosis, focal lesions (lymphoma, metastases, granulomas), immunohistochemistry</td></tr>
<tr><td>Limitations</td><td>Fails ("dry tap") with fibrosis or packed marrow; can be diluted with blood</td><td>Decalcification can damage DNA; results take days; cytology less fine</td></tr>
<tr><td>Quality check</td><td>Particles present on the films; count in the trails behind particles</td><td>Core at least 1.5–2 cm long (ICSH/BSH guidance), not just cortex and cartilage</td></tr>
</tbody></table>
<h3>Normal adult differential count</h3>
<p>Count at least 500 nucleated cells, ideally on two films. Typical adult ranges are below. Ranges differ between published series, so use your department's table where one exists.</p>
<table class="t num"><thead><tr><th>Cell</th><th>% of nucleated cells</th></tr></thead><tbody>

<tr><td>Promyelocytes</td><td>2–8</td></tr>

<tr><td>Basophils</td><td>0–1</td></tr>

<tr><td>Lymphocytes</td><td>5–20 (higher in children)</td></tr>
<tr><td>Plasma cells</td><td>0–3</td></tr>
<tr><td>Erythroblasts (all stages)</td><td>15–30</td></tr>
<tr><td>Myeloid to erythroid (M:E) ratio</td><td>About 2:1 to 4:1</td></tr>
</tbody></table>
<h3>Iron stain (Perls Prussian blue)</h3>
<p>Storage iron is assessed in macrophages within particles and graded (for example 0 to 6 in the Gale scale). Normal sideroblasts, with one to a few fine blue granules, make up about 20% to 50% of erythroblasts. A ring sideroblast has 5 or more granules covering at least one third of the nuclear circumference; ring sideroblasts are not seen in normal marrow.</p>
<h3>Reticulin</h3>
<p>Graded on a silver stain from MF-0 to MF-3 (European consensus, used by WHO). Normal marrow is MF-0 to MF-1: scattered linear reticulin without intersections, mainly around vessels.</p>

<p>Anaemia is a haemoglobin below the reference range for age, sex and pregnancy status. The WHO cut-offs are 130 g/L for men, 120 g/L for non-pregnant women and 110 g/L in pregnancy. Anaemia is a finding, not a diagnosis: the job is to find its cause.</p>
<h3>Two questions that classify almost every anaemia</h3>
<ol>
<li><b>Is the marrow responding?</b> The reticulocyte count separates <i>hypoproliferative</i> anaemias (low or inappropriately normal reticulocytes: deficiency, marrow failure, infiltration, renal disease, inflammation) from <i>hyperproliferative</i> ones (raised reticulocytes: bleeding or haemolysis).</li>
<li><b>What size are the red cells?</b> MCV sorts the hypoproliferative group into microcytic, normocytic and macrocytic.</li>
</ol>
<div class="tablewrap"><table class="t"><thead><tr><th>Microcytic (MCV under 83 fL)</th><th>Normocytic</th><th>Macrocytic (MCV over 101 fL)</th></tr></thead><tbody>
<tr><td>Iron deficiency</td><td>Anaemia of inflammation (early)</td><td>Megaloblastic: B12 or folate deficiency, drugs (methotrexate, hydroxycarbamide)</td></tr>

<tr><td>Sideroblastic anaemia (hereditary)</td><td>Marrow infiltration or failure</td><td>Myelodysplastic neoplasms, aplastic anaemia</td></tr>
<tr><td>Lead poisoning (rarely)</td><td>Mixed deficiency (micro plus macro, with a high RDW)</td><td>Reticulocytosis (haemolysis, recovery)</td></tr>
</tbody></table></div>
<h3>The blood film</h3>
<p>Always look at the film. A few patterns settle the diagnosis on their own: spherocytes (hereditary spherocytosis, warm AIHA), fragments (microangiopathy), sickle cells, target cells with microcytosis (haemoglobinopathy), oval macrocytes with hypersegmented neutrophils (megaloblastic), a leucoerythroblastic picture with teardrop cells (marrow infiltration or fibrosis), and rouleaux (paraprotein).</p>
<h3>The red cell distribution width</h3>
<p>RDW measures variation in red cell size. It rises early in iron deficiency and in mixed deficiencies, and is usually normal in uncomplicated thalassaemia trait. It is a useful supporting clue, never a diagnosis on its own.</p>
<h3>Correcting the reticulocyte count</h3>
<p>A reticulocyte percentage overstates marrow output in anaemia, because the denominator (red cells) is small and stressed reticulocytes circulate longer. Report the absolute count, or use the reticulocyte production index (RPI): an RPI below 2 in an anaemic patient means the marrow is not keeping up. The calculator in the workups section does this.</p>

  body: `
<p>The body holds 3 to 4 g of iron, two thirds of it in haemoglobin. There is no regulated excretion route, so balance is controlled at absorption. Daily losses of about 1 mg (about 2 mg in menstruating women) are replaced from 1 to 2 mg absorbed from the diet.</p>
<h3>The iron cycle</h3>
<ul>
<li><b>Absorption:</b> in the duodenum. Ferric iron is reduced by duodenal cytochrome b (DCYTB) and enters the enterocyte through DMT1. Haem iron is absorbed separately and more efficiently.</li>
<li><b>Export:</b> ferroportin is the only known cellular iron exporter, on enterocytes, macrophages and hepatocytes. Hephaestin (gut) and ceruloplasmin (plasma) oxidise iron for loading onto transferrin.</li>
<li><b>Transport:</b> transferrin carries iron to transferrin receptor 1 on erythroblasts.</li>
<li><b>Recycling:</b> macrophages recover about 20 to 25 mg a day from senescent red cells, which is most of what the marrow uses.</li>
<li><b>Control:</b> hepcidin, made by the liver, binds ferroportin and causes its internalisation and breakdown. Hepcidin rises with iron loading and inflammation (IL-6), and falls with iron deficiency, hypoxia and active erythropoiesis (through erythroferrone).</li>
</ul>
<h3>Stages of iron deficiency</h3>
<ol>
<li><b>Depleted stores:</b> ferritin falls; haemoglobin is normal.</li>
<li><b>Iron-deficient erythropoiesis:</b> transferrin saturation falls, zinc protoporphyrin and soluble transferrin receptor rise, reticulocyte haemoglobin content falls.</li>
<li><b>Iron deficiency anaemia:</b> haemoglobin falls; microcytosis and hypochromia appear, with pencil cells and a raised RDW. Platelets are often raised.</li>

<h3>Laboratory diagnosis</h3>

  body: `
<p>Megaloblastic anaemia results from impaired DNA synthesis, usually from vitamin B<sub>12</sub> (cobalamin) or folate deficiency. Nuclear maturation lags behind cytoplasmic maturation in every dividing lineage, and many precursors die in the marrow (ineffective haematopoiesis).</p>
<h3>Physiology</h3>
<ul>
<li><b>B<sub>12</sub>:</b> released from food by acid and pepsin, bound by haptocorrin, transferred to intrinsic factor (from gastric parietal cells) in the duodenum, and absorbed in the terminal ileum through the cubam receptor. Transported in plasma by transcobalamin (holotranscobalamin is the active fraction). Stores of 2 to 3 mg last several years.</li>
<li><b>Folate:</b> absorbed in the proximal jejunum. Stores last only about 4 months.</li>
<li><b>Biochemistry:</b> B<sub>12</sub> is needed for methionine synthase (homocysteine to methionine, regenerating tetrahydrofolate) and for methylmalonyl-CoA mutase. So methylmalonic acid rises only in B<sub>12</sub> deficiency, while homocysteine rises in both.</li>
</ul>
<h3>Causes</h3>
<div class="tablewrap"><table class="t"><thead><tr><th>B<sub>12</sub> deficiency</th><th>Folate deficiency</th></tr></thead><tbody>
<tr><td>Pernicious anaemia (autoimmune gastritis)</td><td>Poor diet, alcohol</td></tr>
<tr><td>Gastrectomy, bariatric surgery</td><td>Increased demand: pregnancy, haemolysis, exfoliative skin disease</td></tr>
<tr><td>Ileal resection or Crohn disease, bacterial overgrowth, fish tapeworm</td><td>Malabsorption: coeliac disease</td></tr>
<tr><td>Strict vegan diet</td><td>Drugs: methotrexate, trimethoprim, phenytoin</td></tr>
<tr><td>Drugs: metformin, proton pump inhibitors; nitrous oxide inactivates B<sub>12</sub></td><td>Dialysis losses</td></tr>
</tbody></table></div>
<h3>Laboratory features</h3>
<ul>
<li><b>Blood:</b> oval macrocytes (MCV often over 110 fL), anisopoikilocytosis with teardrops and fragments, Howell–Jolly bodies, hypersegmented neutrophils (5% or more with 5 lobes, or any with 6 or more), and in severe cases pancytopenia. Reticulocytes are low.</li>
<li><b>Chemistry:</b> raised LDH (often very high) and unconjugated bilirubin, from intramedullary haemolysis.</li>
<li><b>Marrow:</b> hypercellular with megaloblasts (large erythroblasts with open, sieve-like chromatin despite haemoglobinised cytoplasm), giant metamyelocytes and band forms, and hypersegmented megakaryocytes.</li>

<h3>Diagnosing the cause</h3>
<p>Serum B<sub>12</sub> has poor sensitivity and specificity near the cut-off; holotranscobalamin and methylmalonic acid help in borderline cases. For pernicious anaemia, intrinsic factor antibodies are highly specific but positive in only about half of patients; parietal cell antibodies are sensitive but not specific. A raised gastrin and low pepsinogen support autoimmune gastritis.</p>

<p>Alcohol, liver disease and hypothyroidism give round macrocytes with an MCV usually under 110 fL. Reticulocytosis raises the MCV because reticulocytes are larger. Myelodysplastic neoplasms cause macrocytosis with dysplasia, and are covered in Module 3.</p>

<h3>G6PD deficiency</h3>

<p>Haemoglobin disorders are either <b>thalassaemias</b> (reduced synthesis of structurally normal globin chains) or <b>structural variants</b> (an altered chain, such as HbS, HbC or HbE). Some variants, such as HbE, are also synthesised at a reduced rate and behave like a mild thalassaemia.</p>
<h3>α-thalassaemia</h3>
<p>Usually caused by deletions of one or both of the paired α genes on chromosome 16 (αα/αα normally).</p>
<div class="tablewrap"><table class="t"><thead><tr><th>Genotype</th><th>Name</th><th>Picture</th></tr></thead><tbody>
<tr><td>−α/αα</td><td>Silent carrier</td><td>Normal or borderline indices</td></tr>
<tr><td>−−/αα or −α/−α</td><td>α-thalassaemia trait</td><td>Microcytosis, normal HbA<sub>2</sub>; diagnosed by DNA analysis. The cis form (−−/αα) is common in Southeast Asia and matters for the risk of hydrops in offspring</td></tr>
<tr><td>−−/−α</td><td>HbH disease</td><td>Moderate haemolytic anaemia; β<sub>4</sub> tetramers (HbH) seen as "golf ball" inclusions on brilliant cresyl blue staining</td></tr>
<tr><td>−−/−−</td><td>Hb Bart's hydrops fetalis</td><td>γ<sub>4</sub> tetramers; usually fatal in utero</td></tr>
</tbody></table></div>
<h3>β-thalassaemia</h3>
<p>Usually point mutations of the β gene on chromosome 11, reducing (β<sup>+</sup>) or abolishing (β<sup>0</sup>) output. Excess α chains precipitate in erythroblasts and cause ineffective erythropoiesis.</p>
<ul>
<li><b>Trait:</b> microcytosis with a normal or raised RBC count, mild or no anaemia, and HbA<sub>2</sub> above 3.5% (often 4% to 6%). HbF is normal or slightly raised.</li>
<li><b>Thalassaemia major:</b> transfusion-dependent from the first year of life; HbA absent (β<sup>0</sup>/β<sup>0</sup>) or very low, mostly HbF. Extramedullary haematopoiesis, bone deformity and iron overload.</li>
<li><b>Thalassaemia intermedia (non-transfusion-dependent):</b> a clinical label for milder genotypes.</li>

<p><b>Pitfall:</b> coexisting iron deficiency lowers HbA<sub>2</sub> and can mask β-thalassaemia trait. Correct the iron and repeat if the result does not fit.</p>
<h3>Screening indices</h3>
<p>The Mentzer index (MCV ÷ RBC count) is below 13 in thalassaemia trait and above 13 in iron deficiency more often than not. It is a quick triage tool, not a diagnosis. The calculator in the workups section includes it.</p>

<ul>

<li><b>HbC:</b> β6 glutamic acid to lysine. Target cells and intracellular crystals.</li>
<li><b>HbE:</b> common in Southeast Asia; microcytosis; HbE/β-thalassaemia can be severe.</li>
<li><b>Unstable haemoglobins and high-affinity variants:</b> Heinz body haemolysis and erythrocytosis respectively.</li>

<h3>The direct antiglobulin test (DAT)</h3>
<p>The DAT detects IgG or complement (C3d) already bound to the patient's red cells, using anti-human globulin. A monospecific DAT tells you which is present, and that points to the type of immune haemolysis. A positive DAT is not proof of haemolysis: it occurs in up to about 1 in 1000 healthy blood donors and in many hospital patients. Conversely, a few cases of AIHA are DAT-negative by standard methods.</p>
<h3>Warm autoimmune haemolytic anaemia</h3>
<p>IgG antibodies, active at 37°C, usually with broad specificity within the Rh system. DAT is positive for IgG, with or without C3d. Spherocytes are typical, with extravascular haemolysis in the spleen. Half of cases are secondary: CLL and other lymphomas, SLE and other autoimmune diseases, drugs, and immunodeficiency.</p>
<h3>Cold agglutinin disease</h3>
<p>IgM antibodies, usually anti-I, active below body temperature. They fix complement, so the DAT is positive for C3d only. Red cells agglutinate on the film and in the tube, which causes the spurious indices covered in Module 1. Primary cold agglutinin disease is a clonal B cell disorder; secondary cold agglutinins follow Mycoplasma pneumoniae (anti-I) or EBV infection (anti-i), or accompany lymphoma.</p>
<h3>Paroxysmal cold haemoglobinuria</h3>
<p>The Donath–Landsteiner antibody is a biphasic IgG with anti-P specificity: it binds in the cold and lyses with complement on warming. It is seen mainly in children after viral infections, with acute intravascular haemolysis.</p>
<h3>Alloimmune and drug-induced haemolysis</h3>
<p>Alloimmune causes are haemolytic transfusion reactions and haemolytic disease of the fetus and newborn. Drug-induced haemolysis occurs by drug adsorption (penicillin), immune complex formation (ceftriaxone) or true autoantibody induction (methyldopa).</p>
<h3>Microangiopathic haemolytic anaemia (MAHA)</h3>
<p>Red cell fragmentation (schistocytes) with thrombocytopenia. A fragment count above 1% is significant in adults (ICSH). Causes include:</p>
<ul>
<li><b>TTP:</b> ADAMTS13 activity below 10%, usually from an acquired autoantibody. A medical emergency; the PLASMIC score estimates the probability while the assay is pending.</li>
<li><b>Haemolytic uraemic syndrome:</b> Shiga toxin-producing E. coli; atypical HUS from complement dysregulation.</li>
<li><b>Other causes:</b> DIC, HELLP and pre-eclampsia, malignant hypertension, disseminated cancer, and certain drugs.</li>
</ul>
<p>Mechanical haemolysis without thrombocytopenia occurs with prosthetic heart valves and in march haemoglobinuria.</p>
<h3>Paroxysmal nocturnal haemoglobinuria (PNH)</h3>
<p>An acquired PIGA mutation in a haematopoietic stem cell stops GPI-anchor synthesis, so the complement regulators CD55 and CD59 are lost. The results are complement-mediated intravascular haemolysis, thrombosis in unusual sites (hepatic, cerebral and mesenteric veins), and an association with aplastic anaemia.</p>
<p>Diagnosis is by high-sensitivity flow cytometry: FLAER (which binds GPI anchors) with CD24 on neutrophils and CD14 on monocytes, and CD59 on red cells (type I, II and III cells). Measure the clone on white cells, because red cell clones are underestimated after haemolysis or transfusion.</p>
<h3>Other acquired causes</h3>
<p>Malaria, Clostridium perfringens sepsis, babesiosis, severe burns, snake venoms, Wilson disease, and spur cell anaemia in advanced liver disease.</p>

<h3>Aplastic anaemia</h3>
<p>Pancytopenia with a hypocellular marrow, without infiltration or fibrosis. Most acquired cases are immune-mediated destruction of stem cells by T cells. Other causes include drugs (chloramphenicol, gold, anticonvulsants), benzene, viral hepatitis (seronegative), pregnancy and radiation.</p>
<p><b>Severity (Camitta criteria):</b> severe aplastic anaemia needs marrow cellularity below 25% (or 25% to 50% with under 30% residual haematopoietic cells) plus two of: neutrophils below 0.5 × 10<sup>9</sup>/L, platelets below 20 × 10<sup>9</sup>/L, and reticulocytes below 20 × 10<sup>9</sup>/L. Very severe disease has neutrophils below 0.2 × 10<sup>9</sup>/L.</p>
<p>The workup has three aims: exclude hypocellular MDS, look for small PNH clones (present in up to half of patients), and screen for inherited marrow failure.</p>
<h3>Inherited marrow failure syndromes</h3>
<ul>
<li><b>Fanconi anaemia:</b> DNA repair defect; short stature, radial ray and skin abnormalities; diagnosed by increased chromosome breakage with diepoxybutane (DEB) or mitomycin C. High risk of AML and squamous cancers.</li>
<li><b>Telomere biology disorders (dyskeratosis congenita):</b> nail dystrophy, leukoplakia, reticulate pigmentation; very short telomeres on flow-FISH.</li>
<li><b>Shwachman–Diamond syndrome:</b> neutropenia with exocrine pancreatic insufficiency.</li>
<li><b>Diamond–Blackfan anaemia:</b> isolated red cell aplasia in infancy, ribosomal protein genes, raised red cell adenosine deaminase, often macrocytosis and raised HbF.</li>

<h3>Pure red cell aplasia</h3>
<p>Anaemia with reticulocytes near zero and absent erythroid precursors in an otherwise normal marrow. Parvovirus B19 infects erythroid progenitors through the P antigen: giant pronormoblasts with nuclear inclusions are characteristic, and in people with chronic haemolysis it causes an aplastic crisis. Other causes are thymoma, large granular lymphocyte leukaemia, autoimmune disease, drugs, and anti-EPO antibodies.</p>
<h3>Sideroblastic anaemias</h3>
<p>Defective haem synthesis leaves iron in erythroblast mitochondria, which appear as ring sideroblasts on a Perls stain.</p>
<ul>

<h3>Congenital dyserythropoietic anaemias</h3>

<h3>Anaemia of chronic kidney disease</h3>
<p>Mainly inadequate EPO production, with a contribution from inflammation and hepcidin. Normocytic and normochromic, sometimes with echinocytes (burr cells).</p>

<p>Acute lymphoblastic leukaemia (ALL) is the most common childhood cancer, with a peak at 2 to 5 years, and a second rise in older adults. Bone pain, cytopenias, lymphadenopathy, hepatosplenomegaly and, in T-ALL, a mediastinal mass are typical.</p>

<p>Myeloproliferative neoplasms (MPN) are clonal stem cell disorders with effective production of one or more mature myeloid lineages. They carry a risk of thrombosis, fibrotic progression and transformation to AML.</p>
<h3>Chronic myeloid leukaemia, <i>BCR::ABL1</i>-positive</h3>
<p>Caused by t(9;22)(q34;q11), the Philadelphia chromosome, which creates the <i>BCR::ABL1</i> fusion tyrosine kinase. The film shows neutrophilia with a "two-peak" left shift (myelocytes and neutrophils), basophilia, eosinophilia and often thrombocytosis. The marrow is packed with granulocytes and small "dwarf" megakaryocytes.</p>
<ul>
<li><b>WHO-HAEM5</b> recognises only chronic phase and blast phase. The accelerated phase was dropped, because tyrosine kinase inhibitors (TKIs) changed its meaning; instead, high-risk features in chronic phase are reported.</li>
<li><b>ICC 2022</b> keeps the accelerated phase (10 to 19% blasts, basophils 20% or more, or additional high-risk chromosomal abnormalities).</li>
<li><b>Blast phase:</b> 20% or more blasts in blood or marrow, an extramedullary blast proliferation, or (WHO-HAEM5) any increase in lymphoblasts. About a quarter are lymphoid.</li>
</ul>
<p>Monitor response by RT-qPCR on the International Scale: a major molecular response is <i>BCR::ABL1</i> 0.1% IS or less.</p>
<h3>The three driver mutations of Ph-negative MPN</h3>
<ul>
<li><b><i>JAK2</i> V617F:</b> about 95% of PV, 50 to 60% of ET and PMF. <i>JAK2</i> exon 12 mutations account for most of the rest of PV.</li>
<li><b><i>CALR</i> exon 9:</b> 20 to 25% of ET and 25 to 30% of PMF. Type 1 (52 bp deletion) mutations favour a fibrotic course.</li>
<li><b><i>MPL</i> W515:</b> about 5% of ET and PMF.</li>
<li>"Triple-negative" cases need another clonal marker (for example <i>ASXL1</i>, <i>TET2</i>) or careful exclusion of reactive causes.</li>
</ul>
<h3>Diagnostic criteria (WHO-HAEM5, close to ICC)</h3>
<div class="tablewrap"><table class="t"><thead><tr><th>Entity</th><th>Major criteria</th><th>Minor criteria</th></tr></thead><tbody>
<tr><td>Polycythaemia vera</td><td>1. Hb over 165 g/L (men) or 160 g/L (women), or Hct over 49% / 48%<br>2. Marrow panmyelosis with pleomorphic mature megakaryocytes<br>3. <i>JAK2</i> V617F or exon 12</td><td>Subnormal serum erythropoietin. Diagnosis: all 3 major, or major 1 and 2 plus the minor.</td></tr>
<tr><td>Essential thrombocythaemia</td><td>1. Platelets 450 × 10⁹/L or more<br>2. Increased large, hyperlobulated megakaryocytes, no significant left shift of granulopoiesis or erythropoiesis<br>3. Not meeting criteria for other myeloid neoplasms<br>4. <i>JAK2</i>, <i>CALR</i> or <i>MPL</i></td><td>Another clonal marker, or no evidence of reactive thrombocytosis. Diagnosis: all 4 major, or the first 3 plus the minor.</td></tr>
<tr><td>Primary myelofibrosis (overt)</td><td>1. Megakaryocyte proliferation and atypia with reticulin or collagen fibrosis grade 2 or 3<br>2. Not meeting criteria for other myeloid neoplasms<br>3. Driver mutation, another clonal marker, or no reactive fibrosis</td><td>Anaemia, WBC 11 × 10⁹/L or more, palpable splenomegaly, raised LDH, leucoerythroblastosis. Need at least one, confirmed twice.</td></tr>
</tbody></table></div>
<p><b>Prefibrotic PMF</b> has grade 0 or 1 fibrosis but the same atypical, clustered megakaryocytes with hypercellularity. It can look like ET clinically; the trephine is what separates them, and the distinction matters for prognosis.</p>
<h3>Other MPN</h3>
<p>Chronic neutrophilic leukaemia (<i>CSF3R</i> mutation, mature neutrophilia of 25 × 10⁹/L or more), chronic eosinophilic leukaemia (WHO-HAEM5 dropped "not otherwise specified"), juvenile myelomonocytic leukaemia (now classed as an MPN in WHO-HAEM5) and MPN, not otherwise specified. Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions (<i>PDGFRA</i>, <i>PDGFRB</i>, <i>FGFR1</i>, <i>JAK2</i>, <i>FLT3</i>, <i>ETV6::ABL1</i>) are a separate group, important because several respond to imatinib.</p>

<p>Myelodysplastic neoplasms (MDS) are clonal disorders with cytopenia, dysplasia and ineffective haematopoiesis. WHO-HAEM5 renamed "syndromes" as "neoplasms" but kept the abbreviation MDS.</p>
<h3>Dysplasia</h3>
<p>Count dysplasia in 10% or more of cells of a lineage. Key features:</p>
<ul>
<li><b>Erythroid:</b> nuclear budding, internuclear bridging, multinuclearity, megaloblastoid change, ring sideroblasts.</li>
<li><b>Granulocytic:</b> hypogranular neutrophils, pseudo-Pelger nuclei, abnormal nuclear shapes.</li>
<li><b>Megakaryocytic:</b> micromegakaryocytes (the most reliable), small hypolobated or widely separated nuclei.</li>
</ul>
<p>Always exclude B12, folate or copper deficiency, alcohol, drugs, HIV and recent chemotherapy, which can all cause dysplasia.</p>
<h3>WHO-HAEM5 classification of MDS</h3>
<div class="tablewrap"><table class="t"><thead><tr><th>Type</th><th>Defining features</th></tr></thead><tbody>
<tr><td>MDS with low blasts and isolated del(5q) (MDS-5q)</td><td>del(5q) alone or with one other abnormality other than −7/del(7q); blasts under 5% marrow and under 2% blood</td></tr>
<tr><td>MDS with low blasts and <i>SF3B1</i> mutation (MDS-SF3B1)</td><td><i>SF3B1</i> VAF 5% or more (or ring sideroblasts 15% or more), no del(5q), −7 or complex karyotype, blasts as above</td></tr>
<tr><td>MDS with biallelic <i>TP53</i> inactivation (MDS-biTP53)</td><td>Two or more <i>TP53</i> hits; blasts under 20%</td></tr>
<tr><td>MDS with low blasts (MDS-LB)</td><td>Blasts under 5% marrow and under 2% blood</td></tr>
<tr><td>Hypoplastic MDS (MDS-h)</td><td>Marrow cellularity 25% or less (age-adjusted)</td></tr>
<tr><td>MDS with increased blasts 1 (MDS-IB1)</td><td>5–9% marrow or 2–4% blood</td></tr>
<tr><td>MDS with increased blasts 2 (MDS-IB2)</td><td>10–19% marrow, 5–19% blood, or Auer rods</td></tr>
<tr><td>MDS with fibrosis (MDS-f)</td><td>5–19% marrow blasts with grade 2 or 3 fibrosis</td></tr>
</tbody></table></div>
<h3>How ICC 2022 differs</h3>
<p>ICC uses MDS with mutated <i>SF3B1</i>, MDS with del(5q), MDS not otherwise specified (with single or multilineage dysplasia), MDS with excess blasts (5–9% marrow or 2–9% blood) and MDS/AML (10–19%). <i>TP53</i>-mutated myeloid neoplasms form their own group across MDS, MDS/AML and AML. ICC does not use Auer rods to upgrade the category.</p>
<h3>Precursor states</h3>
<p><b>CHIP</b> (clonal haematopoiesis of indeterminate potential) is a somatic myeloid mutation with VAF 2% or more and normal counts. <b>CCUS</b> is the same with unexplained cytopenia but without diagnostic dysplasia. Both are now named in the classifications.</p>
<h3>Chronic myelomonocytic leukaemia (CMML)</h3>
<p>WHO-HAEM5 criteria: persistent monocytosis of 0.5 × 10⁹/L or more and 10% or more of white cells; blasts and promonocytes under 20%; not meeting criteria for CML or another MPN. If monocytes are 0.5 to 0.9 × 10⁹/L, clonality and dysplasia are needed. Abnormal partitioning of monocyte subsets on flow (classical CD14+ CD16− monocytes over 94%) supports the diagnosis.</p>
<ul>
<li><b>Myelodysplastic type</b> (MD-CMML): WBC under 13 × 10⁹/L. <b>Myeloproliferative type</b> (MP-CMML): WBC 13 × 10⁹/L or more.</li>
<li><b>CMML-1:</b> blasts under 5% blood and under 10% marrow. <b>CMML-2:</b> 5–19% blood or 10–19% marrow.</li>
</ul>
<p>Other MDS/MPN: MDS/MPN with neutrophilia (formerly atypical CML, <i>SETBP1</i>, <i>ASXL1</i>), MDS/MPN with <i>SF3B1</i> mutation and thrombocytosis, and MDS/MPN not otherwise specified.</p>
<h3>Prognosis</h3>
<p>IPSS-R uses karyotype, blasts, Hb, platelets and neutrophils. The molecular IPSS-M adds 31 genes and is now preferred where sequencing is available.</p>

<p>Mature B-cell neoplasms are the lymphomas and leukaemias of antigen-exposed B cells. In the haematology laboratory they usually present as a lymphocytosis, cytopenias or an abnormal film. Flow cytometry first proves clonality (light chain restriction), then the phenotype points to the entity.</p>
<h3>Chronic lymphocytic leukaemia and monoclonal B-cell lymphocytosis</h3>
<p>Small lymphocytes with dense, "cracked" chromatin and smudge cells on the film. CLL needs 5 × 10⁹/L or more clonal B cells with the CLL phenotype for at least 3 months. Under that number, without lymphadenopathy, organomegaly or cytopenias, the diagnosis is monoclonal B-cell lymphocytosis (MBL). SLL is the same disease mainly in lymph nodes.</p>

<p>Prognostic testing before treatment: <i>TP53</i> mutation and del(17p) by FISH, <i>IGHV</i> mutation status, and complex karyotype. WHO-HAEM5 removed B-prolymphocytic leukaemia as an entity; CLL with over 15% prolymphocytes is called "prolymphocytic progression of CLL".</p>
